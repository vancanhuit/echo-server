[tools]
bun = "1.4.4"
go = "1.27.3"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
actionlint = "1.7.12"
svu = "3.4.1"

[env]
PORT = { default = "8080" }
LOGS_LEVEL = { default = "info" }
_.file = ".env"

[tasks.setup]
description = "Download Go modules and install commit hooks"
run = ["go mod download", "bun install --frozen-lockfile"]

[tasks.dev]
description = "Run the echo server"
run = "go run ./cmd/echo-server"

[tasks.build]
description = "Build the standalone binary"
run = "scripts/build.sh binary"

[tasks.generate]
description = "Generate Go models from OpenAPI"
run = "go generate ./api"

[tasks."generate:check"]
description = "Verify generated models are up to date"
run = "oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml | diff -u api/models.gen.go -"

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w cmd internal api"

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race -count=1 ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.vuln]
description = "Check dependencies for known vulnerabilities"
run = "govulncheck ./..."

[tasks.check]
description = "Run tests, lint, and generated-code checks"
depends = ["test", "lint", "generate:check", "release:check", "workflows:check"]

[tasks."docker:build"]
description = "Build and load the native-platform container image"
run = "scripts/build.sh docker"

[tasks."docker:build:multi"]
description = "Build AMD64/ARM64 images into dist/echo-server-image.tar (OCI archive)"
run = "scripts/build.sh docker-multi"

[tasks."workflows:check"]
description = "Validate GitHub Actions workflows"
run = "actionlint"

[tasks."release:check"]
description = "Validate GoReleaser configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build release archives locally without publishing"
run = "goreleaser release --snapshot --clean --parallelism 2"

[tasks."version:next"]
description = "Calculate the next v-prefixed version from Conventional Commits"
run = "svu next --tag.prefix=v"

[tasks."release:tag"]
description = "Create and push the next svu-calculated release tag (run after CI passes)"
run = '''
set -eu
if [ -n "$(git status --porcelain)" ]; then
  printf 'Commit or stash changes before tagging a release.\n' >&2
  exit 1
fi
tag="$(mise run --quiet version:next)"
git tag -a "$tag" -m "Release $tag"
git push origin "$tag"
'''

[tasks.release]
description = "Check, publish the multi-arch image, then create the GitHub Release"
depends = ["check", "vuln"]
run = ["mise run docker:publish", "goreleaser release --clean --parallelism 2"]

[tasks."docker:publish"]
description = "Build and publish AMD64/ARM64 images to GHCR (requires VERSION and docker login)"
run = '''
set -eu
: "${VERSION:?Set VERSION to a semantic tag such as v1.1.0}"
export VERSION
scripts/build.sh docker-publish
'''

[tasks.ci]
description = "Run the same complete validation and builds as GitHub Actions"
run = [
  "mise run setup",
  "mise run version:next",
  "mise run check",
  "mise run vuln",
  "mise run build",
  "mise run release:snapshot",
  "mise run docker:build:multi",
]
